name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["arena/01a07a40-rahpeyman"]
    paths:
      - ".github/workflows/build-apk.yml"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"

permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: |
          flutter doctor -v
          yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release, per-ABI)
        run: |
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://api.rahpeyman.ir 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Show build output
        run: ls -lh build/app/outputs/flutter-apk/ || true

      - name: Publish outputs to ci-outputs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p dist
          [ -f build.log ] && cp build.log dist/
          cp build/app/outputs/flutter-apk/*.apk dist/ 2>/dev/null || true
          echo "=== dist ==="
          ls -lh dist/

          cd "$(mktemp -d)"
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          cp "$GITHUB_WORKSPACE/dist/"* . 2>/dev/null || true
          git add -A
          git commit -qm "ci outputs $(date -u +%FT%TZ)" || true
          git push -qf origin HEAD:refs/heads/ci-outputs --force
          echo "PUSHED_TO_ci-outputs"
