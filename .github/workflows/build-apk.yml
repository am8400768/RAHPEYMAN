name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["arena/01a07a40-rahpeyman"]
    paths: [".github/workflows/build-apk.yml"]

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release, per-ABI)
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://api.rahpeyman.ir

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rahpeyman-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
