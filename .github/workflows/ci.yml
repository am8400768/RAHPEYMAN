name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee ci-flutter-analyze.log; [[ ${PIPESTATUS[0]} -eq 0 ]]

      - name: Test
        run: |
          flutter test 2>&1 | tee ci-flutter-test.log; [[ ${PIPESTATUS[0]} -eq 0 ]]

      - name: Publish CI logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          D=$(mktemp -d)
          cd "$D"
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          cp "$GITHUB_WORKSPACE"/ci-flutter-*.log . 2>/dev/null || true
          git add -A
          git commit -qm "ci logs $(date -u +%FT%TZ)" || true
          git push -qf origin HEAD:refs/heads/ci-logs --force
          echo "PUSHED_TO_ci-logs"

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt 2>&1 | tee "$GITHUB_WORKSPACE/ci-backend-pip.log"; [[ ${PIPESTATUS[0]} -eq 0 ]]

      - name: Test
        run: pytest -q

      - name: Publish CI logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          D=$(mktemp -d)
          cd "$D"
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          cp "$GITHUB_WORKSPACE"/ci-backend-*.log . 2>/dev/null || true
          git add -A
          git commit -qm "ci backend logs $(date -u +%FT%TZ)" || true
          git push -qf origin HEAD:refs/heads/ci-logs-backend --force
          echo "PUSHED_TO_ci-logs-backend"
