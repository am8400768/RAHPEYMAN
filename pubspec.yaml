name: rahpeyman
description: FINALL
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^0.4.5+4
  path: ^1.8.3
  pdf: ^3.10.4
  printing: ^5.11.1
  crypto: ^3.0.6
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/sharayet_omoomi_piman.sql
    - assets/data/estefsarieh_data.json
    - assets/data/estefsarieh_data.sqlite
    - assets/data/pipes.db
    - assets/data/bricks.sql
    - assets/images/logo/10.png

  fonts:
    - family: Dima.Sogand.New
      fonts:
        - asset: assets/fonts/Dima.Sogand.New.ttf

    - family: ETHNOCEN
      fonts:
        - asset: assets/fonts/ETHNOCEN.TTF

    - family: IRANSansWeb(FaNum)
      fonts:
        - asset: assets/fonts/IRANSansWeb(FaNum).ttf

    - family: IRANSansWeb
      fonts:
        - asset: assets/fonts/IRANSansWeb.ttf

    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Thin.ttf
          weight: 100
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
